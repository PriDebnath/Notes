services:
  backend-express:
    container_name: backend-express      
    build:
      context: .      #  root
      dockerfile: backend-express/Dockerfile
    env_file:
      - .env
    ports: 
      - 8000:8000
    volumes:
      - .:/app
      - /app/node_modules
      - /root/.local/share/pnpm/store
    environment:
      - CI=true
    command: pnpm --filter backend-express dev

